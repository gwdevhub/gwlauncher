name: Build
on:
    pull_request:
        branches: [ "dev" ]
        paths:
            - 'backend/**'
            - 'frontend/**'
            - 'assets/**'
            - 'build.sh'
            - 'build.ps1'
            - 'Dockerfile'
            - 'Dockerfile.toolchain'
            - '.github/workflows/build.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: build-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        defaults:
            run:
                shell: bash
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Set up Node
                uses: actions/setup-node@v7
                with:
                    node-version: 22

            -   name: Build both launchers
                run: bash build.sh all

            -   name: Check the web page build is current
                run: git diff --exit-code -- frontend/dist
