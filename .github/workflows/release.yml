name: Release
on:
    push:
        branches: [ "master" ]
        paths:
            - 'backend/**'
            - 'frontend/**'
            - 'assets/**'
            - 'build.sh'
            - 'build.ps1'
            - 'Dockerfile'
            - 'Dockerfile.toolchain'
            - '.github/workflows/release.yml'
            - '.github/scripts/verify-certum.sh'
    workflow_dispatch:
permissions:
    contents: read
jobs:
    build:
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            actions: write
        defaults:
            run:
                shell: bash
        steps:
            # The full history: the tag is the commit count, which the launcher's build number also uses.
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Version
                id: version
                run: echo "tag=r$(git rev-list --count HEAD).0" >> "$GITHUB_OUTPUT"

            -   name: Set up Node
                uses: actions/setup-node@v7
                with:
                    node-version: 22

            -   name: Build both launchers
                run: bash build.sh all

            # build.sh rebuilds the page, so the committed build must match its sources.
            -   name: Check the web page build is current
                run: git diff --exit-code -- frontend/dist

            # Older launchers look for GW_Launcher.exe and GW_Launcher_Framework_Dependent.exe in the release by name.
            -   name: Stage the release files
                run: |
                    mkdir -p release
                    cp bin/windows/GW_Launcher.exe release/GW_Launcher.exe
                    cp bin/windows/GW_Launcher.exe release/GW_Launcher_Framework_Dependent.exe
                    cp bin/linux/release/GW_Launcher release/GW_Launcher

            -   name: Check Certum credentials
                if: github.ref == 'refs/heads/master'
                env:
                    CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
                    CERTUM_USERID: ${{ secrets.CERTUM_USERID }}
                    CERTUM_CERT_SHA1: ${{ secrets.CERTUM_CERT_SHA1 }}
                run: |
                    for name in CERTUM_OTP_URI CERTUM_USERID CERTUM_CERT_SHA1; do
                        if [[ -z "${!name}" ]]; then
                            echo "Required signing secret $name is missing; refusing to publish unsigned binaries." >&2
                            exit 1
                        fi
                    done

            -   name: Install signing and verification tools
                if: github.ref == 'refs/heads/master'
                run: |
                    set -euo pipefail
                    sudo apt-get update -qq
                    sudo apt-get install -y --no-install-recommends osslsigncode ca-certificates
                    curl --fail --location --retry 3 --output "$RUNNER_TEMP/ssign.tar.gz" \
                        https://github.com/Le-Syl21/ssign/releases/download/v0.1.8/ssign-linux-x86_64.tar.gz
                    echo "fc38f083ea1f061a097a3a9c5dc1a056c9c7310a47e40f56a8976895ec5a928d  $RUNNER_TEMP/ssign.tar.gz" | sha256sum --check
                    mkdir -p "$RUNNER_TEMP/ssign-bin"
                    tar -xzf "$RUNNER_TEMP/ssign.tar.gz" -C "$RUNNER_TEMP/ssign-bin"
                    "$RUNNER_TEMP/ssign-bin/ssign" --version
                    osslsigncode --version

            -   name: Sign Windows binaries with Certum
                if: github.ref == 'refs/heads/master'
                timeout-minutes: 10
                env:
                    CERTUM_EMAIL: ${{ secrets.CERTUM_USERID }}
                    CERTUM_OTP: ${{ secrets.CERTUM_OTP_URI }}
                run: |
                    "$RUNNER_TEMP/ssign-bin/ssign" --timestamp-url http://time.certum.pl/ \
                        release/GW_Launcher.exe release/GW_Launcher_Framework_Dependent.exe

            -   name: Verify signatures, timestamps and signer identity
                if: github.ref == 'refs/heads/master'
                timeout-minutes: 10
                env:
                    CERTUM_CERT_SHA1: ${{ secrets.CERTUM_CERT_SHA1 }}
                run: bash .github/scripts/verify-certum.sh release/GW_Launcher.exe release/GW_Launcher_Framework_Dependent.exe

            -   name: Create the release
                if: github.ref == 'refs/heads/master'
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    RELEASE_TAG: ${{ steps.version.outputs.tag }}
                run: |
                    gh release create "$RELEASE_TAG" \
                        --target "$GITHUB_SHA" \
                        --title "Release $RELEASE_TAG" \
                        --generate-notes \
                        release/GW_Launcher.exe \
                        release/GW_Launcher_Framework_Dependent.exe \
                        release/GW_Launcher

            # A release made with the workflow token doesn't trigger other workflows, so the site is rebuilt here to pick it up.
            -   name: Rebuild the site
                if: github.ref == 'refs/heads/master'
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: gh workflow run site-deploy.yml --ref master
