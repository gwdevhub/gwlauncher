name: Release
on:
    push:
        branches: [ "master" ]
        paths:
            - 'backend/**'
            - 'frontend/**'
            - 'assets/**'
            - 'build.sh'
            - 'build.ps1'
            - 'Dockerfile'
            - 'Dockerfile.toolchain'
            - '.github/workflows/release.yml'
            - '.github/scripts/*simplysign*'
            - '.github/scripts/sign-certum.ps1'
    workflow_dispatch:
permissions:
    contents: read
jobs:
    build:
        runs-on: ubuntu-24.04
        outputs:
            tag: ${{ steps.version.outputs.tag }}
        defaults:
            run:
                shell: bash
        steps:
            # The full history: the tag is the commit count, which the launcher's build number also uses.
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Version
                id: version
                run: echo "tag=r$(git rev-list --count HEAD).0" >> "$GITHUB_OUTPUT"

            -   name: Set up Node
                uses: actions/setup-node@v7
                with:
                    node-version: 22

            -   name: Build both launchers
                run: bash build.sh all

            # build.sh rebuilds the page, so the committed build must match its sources.
            -   name: Check the web page build is current
                run: git diff --exit-code -- frontend/dist

            # Older launchers look for GW_Launcher.exe and GW_Launcher_Framework_Dependent.exe in the release by name.
            -   name: Stage the release files
                run: |
                    mkdir -p release
                    cp bin/windows/GW_Launcher.exe release/GW_Launcher.exe
                    cp bin/windows/GW_Launcher.exe release/GW_Launcher_Framework_Dependent.exe
                    cp bin/linux/release/GW_Launcher release/GW_Launcher

            -   name: Upload unsigned Windows binaries
                uses: actions/upload-artifact@v7
                with:
                    name: windows-unsigned
                    path: release/*.exe
                    if-no-files-found: error

            -   name: Upload Linux binary
                uses: actions/upload-artifact@v7
                with:
                    name: linux-release
                    path: release/GW_Launcher
                    if-no-files-found: error

    sign:
        if: github.ref == 'refs/heads/master'
        needs: build
        runs-on: windows-2025
        timeout-minutes: 20
        defaults:
            run:
                shell: pwsh
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Check Certum credentials
                env:
                    CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
                    CERTUM_USERID: ${{ secrets.CERTUM_USERID }}
                    CERTUM_CERT_SHA1: ${{ secrets.CERTUM_CERT_SHA1 }}
                run: |
                    foreach ($name in @('CERTUM_OTP_URI', 'CERTUM_USERID', 'CERTUM_CERT_SHA1')) {
                        if (-not [Environment]::GetEnvironmentVariable($name)) {
                            throw "Required signing secret $name is missing; refusing to publish unsigned binaries."
                        }
                    }

            -   name: Download unsigned Windows binaries
                uses: actions/download-artifact@v8
                with:
                    name: windows-unsigned
                    path: release

            -   name: Set up Certum SimplySign
                shell: bash
                run: |
                    bash ./.github/scripts/install-simplysign.sh
                    powershell -ExecutionPolicy Bypass -File "./.github/scripts/configure-simplysign.ps1"

            -   name: Authenticate Certum SimplySign
                shell: bash
                env:
                    CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
                    CERTUM_USERID: ${{ secrets.CERTUM_USERID }}
                    CERTUM_CERT_SHA1: ${{ secrets.CERTUM_CERT_SHA1 }}
                run: powershell -ExecutionPolicy Bypass -File "./.github/scripts/connect-simplysign.ps1"

            -   name: Sign and verify Windows binaries
                env:
                    CERTUM_CERT_SHA1: ${{ secrets.CERTUM_CERT_SHA1 }}
                run: ./.github/scripts/sign-certum.ps1 -Files @("release/GW_Launcher.exe", "release/GW_Launcher_Framework_Dependent.exe")

            -   name: Disconnect Certum SimplySign
                if: always()
                run: ./.github/scripts/disconnect-simplysign.ps1

            -   name: Upload signed Windows binaries
                uses: actions/upload-artifact@v7
                with:
                    name: windows-signed
                    path: release/*.exe
                    if-no-files-found: error

    release:
        if: github.ref == 'refs/heads/master'
        needs: [build, sign]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            actions: write
        defaults:
            run:
                shell: bash
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Download signed Windows binaries
                uses: actions/download-artifact@v8
                with:
                    name: windows-signed
                    path: release

            -   name: Download Linux binary
                uses: actions/download-artifact@v8
                with:
                    name: linux-release
                    path: release

            -   name: Create the release
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    RELEASE_TAG: ${{ needs.build.outputs.tag }}
                run: |
                    gh release create "$RELEASE_TAG" \
                        --target "$GITHUB_SHA" \
                        --title "Release $RELEASE_TAG" \
                        --generate-notes \
                        release/GW_Launcher.exe \
                        release/GW_Launcher_Framework_Dependent.exe \
                        release/GW_Launcher

            # A release made with the workflow token doesn't trigger other workflows, so the site is rebuilt here to pick it up.
            -   name: Rebuild the site
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: gh workflow run site-deploy.yml --ref master
