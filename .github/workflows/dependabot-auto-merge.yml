name: Dependabot auto-merge into dev

on:
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge into dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(gh pr view "$PR_URL" --json baseRefName --jq '.baseRefName')
          if [ "$base" != "dev" ]; then
            echo "Refusing to enable auto-merge outside dev."
            exit 1
          fi
          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"
